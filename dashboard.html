<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics Dashboard — Terra Femme</title>
    <meta name="description" content="An interactive BI dashboard: Azure platform cost and reliability, plus client relationship health. Hand-built SVG charts, synthetic data, no BI vendor runtime." />

    <!-- Theme colour is read by mobile browsers for the address bar. The
         dashboard is a dark document, so it declares the dark surface here
         rather than inheriting the portfolio's white. -->
    <meta name="theme-color" content="#0d1210" />

    <!-- Open Graph / link-preview tags (Discord, iMessage, Slack, etc.) —
         og:image and og:url need to be absolute URLs, not relative, or
         most platforms won't render a preview at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Terra Femme Portfolio" />
    <meta property="og:title" content="Analytics Dashboard — Terra Femme" />
    <meta property="og:description" content="Azure platform telemetry and client relationship health. Six report pages, hand-built SVG charts, synthetic data." />
    <meta property="og:url" content="https://terra-femme.github.io/portfolio/dashboard.html" />
    <meta property="og:image" content="https://terra-femme.github.io/portfolio/screenshots/gallery-mask.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Analytics Dashboard — Terra Femme" />
    <meta name="twitter:description" content="Azure platform telemetry and client relationship health. Six report pages, hand-built SVG charts, synthetic data." />
    <meta name="twitter:image" content="https://terra-femme.github.io/portfolio/screenshots/gallery-mask.jpg" />
  </head>
