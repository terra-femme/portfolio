<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Terra Femme</title>
  <!-- Leaf in the site accent green (#1f8a4c), echoing the sprout animation in
       the sidebar. Tilted with a short stem rather than upright: at 16px an
       upright lens reads as a seed, while the tilt plus stem keeps a leaf
       silhouette legible. One bold shape, no small details. -->
  <path d="M17.5 2.5C26 9 27.5 19 15.5 27 5 20 8 8.5 17.5 2.5Z" fill="#1f8a4c"/>
  <!-- Midrib in the accent-soft tone (#e7f2ea). -->
  <path d="M17 6 14.5 25" stroke="#e7f2ea" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Stem: carries the leaf reading down to the smallest sizes. -->
  <path d="M15 25.5 13 30.5" stroke="#1f8a4c" stroke-width="2.4" stroke-linecap="round"/>
</svg>
